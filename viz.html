<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoResearch trace viewer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --green: #2e7d32;
    --grey:  #888;
    --red:   #c62828;
    --orange:#ef6c00;
    --line:  #ddd;
    --text:  #222;
    --muted: #666;
    --bg:    #fff;
    --card:  #fafafa;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 6px 0; font-size: 20px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .meta span { margin-right: 14px; }
  main { padding: 12px 24px 32px; max-width: 1200px; margin: 0 auto; }
  #chart { width: 100%; height: 400px; }
  #status { padding: 24px; color: var(--muted); }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
    padding: 6px 0 12px;
  }
  .legend .swatch {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 4px; vertical-align: middle;
  }
  .detail {
    margin-top: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 20px;
    max-height: 540px;
    overflow-y: auto;
    background: var(--card);
  }
  .detail.empty { color: var(--muted); font-style: italic; padding: 28px 20px; }
  .detail h2 {
    margin: 0 0 12px;
    font-size: 16px; font-weight: 600;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .detail h2 .pill {
    font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px;
    background: #eee; color: #333; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .detail h2 .pill.kept       { background: #e8f5e9; color: #1b5e20; }
  .detail h2 .pill.reverted   { background: #eeeeee; color: #444; }
  .detail h2 .pill.crashed    { background: #ffebee; color: #b71c1c; }
  .detail h2 .pill.parse_failed { background: #fff3e0; color: #e65100; }
  .detail h2 .pill.api_error    { background: #ffebee; color: #b71c1c; }
  .detail h3 {
    margin: 16px 0 6px;
    font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
    font-weight: 600;
  }
  .detail p { margin: 0 0 6px; }
  .detail ul { margin: 0; padding-left: 20px; }
  .detail .hypothesis { font-style: italic; }
  .detail pre {
    background: #1e1e1e; color: #eee;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font: 12.5px/1.5 "SF Mono", Menlo, Consolas, monospace;
    max-height: 360px; overflow-y: auto;
  }
  .detail details {
    margin: 6px 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    background: #fff;
  }
  .detail details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .detail details pre { margin-top: 8px; }
  .err { color: #c62828; padding: 24px; }
  @media (max-width: 700px) {
    main { padding: 8px 12px 24px; }
    header { padding: 14px 14px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>AutoResearch trace</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<main>
  <div id="chart"></div>
  <div class="legend">
    <span><span class="swatch" style="background:#2e7d32"></span>kept</span>
    <span><span class="swatch" style="background:#888"></span>reverted</span>
    <span><span class="swatch" style="background:#c62828"></span>crashed</span>
    <span><span class="swatch" style="background:#ef6c00"></span>parse_failed</span>
    <span><span style="color:#1976d2">━━</span> running best</span>
  </div>
  <div class="detail empty" id="detail">Click a point on the chart to see the iteration details.</div>
</main>

<script>
const COLORS = {
  kept: "#2e7d32",
  reverted: "#888",
  crashed: "#c62828",
  parse_failed: "#ef6c00",
  api_error: "#c62828"
};

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function getParam(name) {
  const u = new URL(window.location.href);
  return u.searchParams.get(name);
}

async function loadTrace(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`fetch ${path} → ${res.status}`);
  const text = await res.text();
  const records = [];
  for (const line of text.split(/\r?\n/)) {
    const t = line.trim();
    if (!t) continue;
    try { records.push(JSON.parse(t)); }
    catch (e) { console.warn("skip bad line", e, t.slice(0, 80)); }
  }
  return records;
}

function computeRunningBest(records) {
  let best = -Infinity;
  return records.map(r => {
    if (typeof r.score === "number" && r.score > best) best = r.score;
    return Number.isFinite(best) ? best : null;
  });
}

function renderHeader(records, tracePath) {
  const meta = document.getElementById("meta");
  if (!records.length) {
    meta.textContent = `trace: ${tracePath} · empty`;
    return;
  }
  const last = records[records.length - 1];
  const totalCost = records.reduce((a, r) => a + (r.cost_usd || 0), 0);
  const bestScore = records.reduce(
    (b, r) => (typeof r.score === "number" && r.score > b) ? r.score : b,
    -Infinity
  );
  const bestStr = Number.isFinite(bestScore) ? bestScore.toFixed(4) : "n/a";
  const start = records[0].timestamp || "";
  meta.innerHTML = `
    <span>trace: <code>${escapeHtml(tracePath)}</code></span>
    <span>iterations: ${records.length}</span>
    <span>best: <strong>${bestStr}</strong></span>
    <span>cost: $${totalCost.toFixed(4)}</span>
    <span>started: ${escapeHtml(start)}</span>
  `;
}

function renderChart(records) {
  const xs = records.map(r => r.iteration);
  const ys = records.map(r => (typeof r.score === "number" ? r.score : null));
  const colors = records.map(r => COLORS[r.status] || "#999");
  const hover = records.map(r => {
    const plan = (r.plan || "").split(/\r?\n/)[0].slice(0, 100);
    const sc = (typeof r.score === "number") ? r.score.toFixed(4) : "n/a";
    return `iter ${r.iteration} · ${r.status}<br>score: ${sc}<br>${escapeHtml(plan)}`;
  });
  const best = computeRunningBest(records);

  const dots = {
    x: xs, y: ys,
    mode: "markers",
    type: "scatter",
    name: "attempt",
    marker: { color: colors, size: 11, opacity: 0.85, line: { width: 0 } },
    text: hover,
    hovertemplate: "%{text}<extra></extra>"
  };
  const line = {
    x: xs, y: best,
    mode: "lines",
    type: "scatter",
    name: "running best",
    line: { color: "#1976d2", width: 2.5, shape: "hv" },
    hoverinfo: "skip"
  };
  const layout = {
    margin: { t: 16, r: 20, b: 44, l: 56 },
    xaxis: { title: "iteration", dtick: 1, gridcolor: "#eee" },
    yaxis: { title: "validation accuracy", gridcolor: "#eee" },
    plot_bgcolor: "#fff", paper_bgcolor: "#fff",
    showlegend: false,
    hovermode: "closest"
  };
  Plotly.newPlot("chart", [line, dots], layout, { displayModeBar: false, responsive: true });

  document.getElementById("chart").on("plotly_click", ev => {
    const pt = ev.points[0];
    if (!pt) return;
    // Ignore clicks on the running-best line — they don't carry an iteration we want to detail.
    if (pt.curveNumber !== 1) return;
    renderDetail(records[pt.pointIndex]);
  });
}

function renderDetail(r) {
  const el = document.getElementById("detail");
  el.classList.remove("empty");
  const sc = (typeof r.score === "number") ? r.score.toFixed(4) : "n/a";
  const dur = (typeof r.duration_seconds === "number") ? r.duration_seconds.toFixed(1) + "s" : "—";
  const status = r.status || "?";

  let html = `<h2>Iteration ${r.iteration}
    <span class="pill ${escapeHtml(status)}">${escapeHtml(status)}</span>
    <span style="color:#666;font-weight:400;font-size:13px">score ${sc} · ${dur}</span>
  </h2>`;

  if (r.reflection) {
    html += `<h3>Reflection</h3><p>${escapeHtml(r.reflection)}</p>`;
  }
  if (Array.isArray(r.observations) && r.observations.length) {
    html += `<h3>Observations</h3><ul>` +
      r.observations.map(o => `<li>${escapeHtml(o)}</li>`).join("") + `</ul>`;
  }
  if (r.hypothesis) {
    html += `<h3>Hypothesis</h3><p class="hypothesis">${escapeHtml(r.hypothesis)}</p>`;
  }
  if (r.plan) {
    html += `<h3>Plan</h3><p>${escapeHtml(r.plan)}</p>`;
  }
  if (r.code) {
    html += `<h3>Code</h3><pre><code>${escapeHtml(r.code)}</code></pre>`;
  }
  if (r.stdout && r.stdout.trim()) {
    html += `<details><summary>stdout</summary><pre>${escapeHtml(r.stdout)}</pre></details>`;
  }
  if (r.stderr && r.stderr.trim()) {
    html += `<details><summary>stderr</summary><pre>${escapeHtml(r.stderr)}</pre></details>`;
  }
  if (r.notes_append) {
    html += `<h3>Note appended</h3><p>${escapeHtml(r.notes_append)}</p>`;
  }
  if (typeof r.input_tokens === "number" || typeof r.output_tokens === "number") {
    const ci = r.input_tokens || 0, co = r.output_tokens || 0;
    const cost = (typeof r.cost_usd === "number") ? `$${r.cost_usd.toFixed(4)}` : "—";
    html += `<h3>Cost</h3><p>${ci} in / ${co} out tokens · ${cost}</p>`;
  }
  if (r.agent_response_raw && status !== "kept" && status !== "reverted") {
    html += `<details><summary>raw agent response</summary><pre>${escapeHtml(r.agent_response_raw)}</pre></details>`;
  }
  el.innerHTML = html;
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

(async () => {
  const tracePath = getParam("trace");
  if (!tracePath) {
    document.querySelector("main").innerHTML =
      `<div class="err">No trace specified. Open this page with <code>?trace=traces/run_*.jsonl</code> in the URL.</div>`;
    document.getElementById("meta").textContent = "no trace";
    return;
  }
  try {
    const records = await loadTrace(tracePath);
    renderHeader(records, tracePath);
    if (!records.length) {
      document.getElementById("detail").textContent = "Trace file is empty.";
      return;
    }
    renderChart(records);
  } catch (e) {
    document.querySelector("main").innerHTML =
      `<div class="err">Failed to load trace: ${escapeHtml(e.message)}<br>
      Tip: serve this directory with <code>python -m http.server</code> so <code>fetch()</code> can read the JSONL.</div>`;
    document.getElementById("meta").textContent = "error";
  }
})();
</script>
</body>
</html>
