<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoResearch trace viewer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --green: #2e7d32;
    --grey:  #888;
    --red:   #c62828;
    --orange:#ef6c00;
    --line:  #ddd;
    --text:  #222;
    --muted: #666;
    --bg:    #fff;
    --card:  #fafafa;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header {
    padding: 24px 32px 14px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 8px 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  header .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; }
  main { padding: 20px 32px 40px; max-width: none; margin: 0; }
  .split { display: flex; gap: 28px; align-items: flex-start; }
  .split-chart { flex: 1 1 60%; min-width: 0; }
  .split-detail { flex: 1 1 40%; min-width: 0; }
  #chart { width: 100%; height: 760px; }
  #status { padding: 24px; color: var(--muted); }
  .chart-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 2px 0;
    flex-wrap: wrap;
  }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  .legend .swatch {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 4px; vertical-align: middle;
  }
  .chart-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .chart-controls input[type="range"] { width: 180px; }
  .chart-controls .value { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .detail {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px 24px;
    height: 800px;
    overflow-y: auto;
    background: var(--card);
    font-size: 15px;
  }
  .detail.empty { color: var(--muted); font-style: italic; padding: 28px 20px; }
  .detail h2 {
    margin: 0 0 12px;
    font-size: 16px; font-weight: 600;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .detail h2 .pill {
    font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px;
    background: #eee; color: #333; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .detail h2 .pill.kept       { background: #e8f5e9; color: #1b5e20; }
  .detail h2 .pill.reverted   { background: #eeeeee; color: #444; }
  .detail h2 .pill.crashed    { background: #ffebee; color: #b71c1c; }
  .detail h2 .pill.parse_failed { background: #fff3e0; color: #e65100; }
  .detail h2 .pill.api_error    { background: #ffebee; color: #b71c1c; }
  .detail h3 {
    margin: 16px 0 6px;
    font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
    font-weight: 600;
  }
  .detail p { margin: 0 0 6px; }
  .detail ul { margin: 0; padding-left: 20px; }
  .detail .hypothesis { font-style: italic; }
  .detail pre {
    background: #1e1e1e; color: #eee;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font: 12.5px/1.5 "SF Mono", Menlo, Consolas, monospace;
    max-height: 360px; overflow-y: auto;
  }
  .detail details {
    margin: 6px 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    background: #fff;
  }
  .detail details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .detail details pre { margin-top: 8px; }
  .err { color: #c62828; padding: 24px; }
  @media (max-width: 1100px) {
    .split { flex-direction: column; }
    .split-chart, .split-detail { flex: 1 1 100%; width: 100%; }
    .detail { height: auto; max-height: 560px; }
    #chart { height: 460px; }
    main { padding: 14px 20px 32px; }
    header h1 { font-size: 22px; }
  }
  @media (max-width: 700px) {
    main { padding: 8px 12px 24px; }
    header { padding: 14px 14px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>AutoResearch Tracer</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<main>
  <div class="split">
    <div class="split-chart">
      <div id="chart"></div>
      <div class="chart-bottom">
        <div class="legend">
          <span><span class="swatch" style="background:#2e7d32"></span>kept</span>
          <span><span class="swatch" style="background:#888"></span>reverted</span>
          <span><span class="swatch" style="background:#c62828"></span>crashed</span>
          <span><span class="swatch" style="background:#ef6c00"></span>parse_failed</span>
          <span><span style="color:#1976d2">━━</span> running best</span>
        </div>
        <div class="chart-controls">
          <label for="chart-height-slider">chart height</label>
          <input type="range" id="chart-height-slider" min="400" max="1100" step="20">
          <span class="value" id="chart-height-value">760px</span>
        </div>
      </div>
    </div>
    <div class="split-detail">
      <div class="detail empty" id="detail">Click a point on the chart to see the iteration details.</div>
    </div>
  </div>
</main>

<script>
const COLORS = {
  kept: "#2e7d32",
  reverted: "#888",
  crashed: "#c62828",
  parse_failed: "#ef6c00",
  api_error: "#c62828"
};

const CHART_HEIGHT_KEY = "chartHeight";
const DEFAULT_CHART_HEIGHT = 760;
const DEFAULT_MODEL_LABEL = "Claude Haiku 4.5";

function modelLabelFromRecords(records) {
  if (records && records.length) {
    for (const r of records) {
      if (r && r.model) return r.model;
    }
  }
  return DEFAULT_MODEL_LABEL;
}

function getSavedChartHeight() {
  const v = parseInt(localStorage.getItem(CHART_HEIGHT_KEY) || "", 10);
  return Number.isFinite(v) && v >= 200 ? v : DEFAULT_CHART_HEIGHT;
}

function applySavedChartHeight() {
  const chartEl = document.getElementById("chart");
  if (chartEl) chartEl.style.height = getSavedChartHeight() + "px";
}

function wireChartHeightSlider() {
  const slider = document.getElementById("chart-height-slider");
  const valueLabel = document.getElementById("chart-height-value");
  const chartEl = document.getElementById("chart");
  if (!slider || !chartEl || slider.dataset.wired) return;
  slider.dataset.wired = "1";
  const initial = getSavedChartHeight();
  slider.value = initial;
  valueLabel.textContent = initial + "px";
  slider.addEventListener("input", e => {
    const h = parseInt(e.target.value, 10);
    chartEl.style.height = h + "px";
    valueLabel.textContent = h + "px";
    localStorage.setItem(CHART_HEIGHT_KEY, String(h));
    if (window.Plotly) Plotly.Plots.resize(chartEl);
  });
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function getParam(name) {
  const u = new URL(window.location.href);
  return u.searchParams.get(name);
}

async function loadTrace(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`fetch ${path} → ${res.status}`);
  const text = await res.text();
  const records = [];
  for (const line of text.split(/\r?\n/)) {
    const t = line.trim();
    if (!t) continue;
    try { records.push(JSON.parse(t)); }
    catch (e) { console.warn("skip bad line", e, t.slice(0, 80)); }
  }
  return records;
}

function computeRunningBest(records) {
  let best = -Infinity;
  return records.map(r => {
    if (typeof r.score === "number" && r.score > best) best = r.score;
    return Number.isFinite(best) ? best : null;
  });
}

// Y-axis range that focuses on the meaningful score band.
// Trims to the 2nd–98th percentile so a single crash at score=0 doesn't
// flatten the chart, then pads by 15% of the visible range.
function autoYRange(records) {
  const scores = records
    .map(r => r.score)
    .filter(s => typeof s === "number");
  if (!scores.length) return null;
  const sorted = [...scores].sort((a, b) => a - b);
  const n = sorted.length;
  const lo = sorted[Math.floor(n * 0.02)];
  const hi = sorted[Math.min(n - 1, Math.ceil(n * 0.98) - 1)];
  const span = Math.max(hi - lo, 0.01);
  const pad = Math.max(span * 0.15, 0.005);
  return [Math.max(0, lo - pad), Math.min(1, hi + pad)];
}

function renderHeader(records, tracePath) {
  const meta = document.getElementById("meta");
  if (!records.length) {
    meta.textContent = `trace: ${tracePath} · empty`;
    return;
  }
  const last = records[records.length - 1];
  const totalCost = records.reduce((a, r) => a + (r.cost_usd || 0), 0);
  const bestScore = records.reduce(
    (b, r) => (typeof r.score === "number" && r.score > b) ? r.score : b,
    -Infinity
  );
  const bestStr = Number.isFinite(bestScore) ? bestScore.toFixed(4) : "n/a";
  const start = records[0].timestamp || "";
  meta.innerHTML = `
    <span><a href="?">← all traces</a></span>
    <span>trace: <code>${escapeHtml(tracePath)}</code></span>
    <span>iterations: ${records.length}</span>
    <span>best: <strong>${bestStr}</strong></span>
    <span>cost: $${totalCost.toFixed(4)}</span>
    <span>started: ${escapeHtml(start)}</span>
    <span>model: ${escapeHtml(modelLabelFromRecords(records))}</span>
  `;
}

function renderChart(records) {
  const xs = records.map(r => r.iteration);
  const ys = records.map(r => (typeof r.score === "number" ? r.score : null));
  const colors = records.map(r => COLORS[r.status] || "#999");
  const hover = records.map(r => {
    const plan = (r.plan || "").split(/\r?\n/)[0].slice(0, 100);
    const sc = (typeof r.score === "number") ? r.score.toFixed(4) : "n/a";
    return `iter ${r.iteration} · ${r.status}<br>score: ${sc}<br>${escapeHtml(plan)}`;
  });
  const best = computeRunningBest(records);

  const dots = {
    x: xs, y: ys,
    mode: "markers",
    type: "scatter",
    name: "attempt",
    marker: { color: colors, size: 11, opacity: 0.85, line: { width: 0 } },
    text: hover,
    hovertemplate: "%{text}<extra></extra>"
  };
  const line = {
    x: xs, y: best,
    mode: "lines",
    type: "scatter",
    name: "running best",
    line: { color: "#1976d2", width: 2.5, shape: "hv" },
    hoverinfo: "skip"
  };
  const yRange = autoYRange(records);
  const layout = {
    margin: { t: 16, r: 20, b: 44, l: 56 },
    xaxis: { title: "iteration", dtick: 1, gridcolor: "#eee" },
    yaxis: {
      title: "validation accuracy",
      gridcolor: "#eee",
      ...(yRange ? { range: yRange, autorange: false } : {})
    },
    plot_bgcolor: "#fff", paper_bgcolor: "#fff",
    showlegend: false,
    hovermode: "closest"
  };
  Plotly.newPlot("chart", [line, dots], layout, { displayModeBar: false, responsive: true });

  document.getElementById("chart").on("plotly_click", ev => {
    const pt = ev.points[0];
    if (!pt) return;
    // Ignore clicks on the running-best line — they don't carry an iteration we want to detail.
    if (pt.curveNumber !== 1) return;
    renderDetail(records[pt.pointIndex]);
  });
}

function renderDetail(r) {
  const el = document.getElementById("detail");
  el.classList.remove("empty");
  const sc = (typeof r.score === "number") ? r.score.toFixed(4) : "n/a";
  const dur = (typeof r.duration_seconds === "number") ? r.duration_seconds.toFixed(1) + "s" : "—";
  const status = r.status || "?";

  const runTag = r._run_label
    ? `<span style="color:#888;font-weight:400;font-size:12px;margin-right:4px">${escapeHtml(r._run_label)}</span>`
    : "";
  let html = `<h2>${runTag}Iteration ${r.iteration}
    <span class="pill ${escapeHtml(status)}">${escapeHtml(status)}</span>
    <span style="color:#666;font-weight:400;font-size:13px">score ${sc} · ${dur}</span>
  </h2>`;

  if (r.reflection) {
    html += `<h3>Reflection</h3><p>${escapeHtml(r.reflection)}</p>`;
  }
  if (Array.isArray(r.observations) && r.observations.length) {
    html += `<h3>Observations</h3><ul>` +
      r.observations.map(o => `<li>${escapeHtml(o)}</li>`).join("") + `</ul>`;
  }
  if (r.hypothesis) {
    html += `<h3>Hypothesis</h3><p class="hypothesis">${escapeHtml(r.hypothesis)}</p>`;
  }
  if (r.plan) {
    html += `<h3>Plan</h3><p>${escapeHtml(r.plan)}</p>`;
  }
  if (r.code) {
    html += `<h3>Code</h3><pre><code>${escapeHtml(r.code)}</code></pre>`;
  }
  if (r.stdout && r.stdout.trim()) {
    html += `<details><summary>stdout</summary><pre>${escapeHtml(r.stdout)}</pre></details>`;
  }
  if (r.stderr && r.stderr.trim()) {
    html += `<details><summary>stderr</summary><pre>${escapeHtml(r.stderr)}</pre></details>`;
  }
  if (r.notes_append) {
    html += `<h3>Note appended</h3><p>${escapeHtml(r.notes_append)}</p>`;
  }
  if (typeof r.input_tokens === "number" || typeof r.output_tokens === "number") {
    const ci = r.input_tokens || 0, co = r.output_tokens || 0;
    const cost = (typeof r.cost_usd === "number") ? `$${r.cost_usd.toFixed(4)}` : "—";
    html += `<h3>Cost</h3><p>${ci} in / ${co} out tokens · ${cost}</p>`;
  }
  if (r.agent_response_raw && status !== "kept" && status !== "reverted") {
    html += `<details><summary>raw agent response</summary><pre>${escapeHtml(r.agent_response_raw)}</pre></details>`;
  }
  el.innerHTML = html;
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function discoverTraces() {
  const res = await fetch("traces/");
  if (!res.ok) return [];
  const html = await res.text();
  const seen = new Set();
  const files = [];
  for (const m of html.matchAll(/href="([^"]+\.jsonl)"/gi)) {
    const name = m[1].split("/").pop();
    if (!seen.has(name)) { seen.add(name); files.push(name); }
  }
  files.sort();
  return files.reverse();
}

function renderTracePicker(files) {
  document.getElementById("meta").textContent = `${files.length} trace file(s) available`;
  const main = document.querySelector("main");
  if (!files.length) {
    main.innerHTML = `<div class="err">No trace files found in <code>traces/</code>. Run <code>python orchestrator.py</code> first.</div>`;
    return;
  }
  const items = files.map(f => `<li><a href="?trace=traces/${encodeURIComponent(f)}">${escapeHtml(f)}</a></li>`).join("");
  main.innerHTML = `
    <p style="margin:6px 0 16px"><a href="?combined=1" style="font-weight:600">→ View all runs combined</a></p>
    <h2 style="font-size:16px;font-weight:600;margin:8px 0 12px">Or pick a single trace</h2>
    <ul style="line-height:1.9;padding-left:20px">${items}</ul>
    <p style="color:#666;font-size:13px">Most recent first.</p>
  `;
}

function shortRunLabel(filename, idx) {
  const m = filename.match(/run_(\d{8})_(\d{6})\.jsonl/i);
  if (m) {
    const d = m[1], t = m[2];
    return `Run ${idx + 1} · ${d.slice(4, 6)}-${d.slice(6, 8)} ${t.slice(0, 2)}:${t.slice(2, 4)}`;
  }
  return `Run ${idx + 1}`;
}

function renderChartCombined(allRecords, runs) {
  const xs = allRecords.map((_, i) => i);
  const ys = allRecords.map(r => (typeof r.score === "number" ? r.score : null));
  const colors = allRecords.map(r => COLORS[r.status] || "#999");
  const hover = allRecords.map((r, i) => {
    const plan = (r.plan || "").split(/\r?\n/)[0].slice(0, 100);
    const sc = (typeof r.score === "number") ? r.score.toFixed(4) : "n/a";
    return `${escapeHtml(r._run_label)}<br>iter ${r.iteration} (global ${i}) · ${r.status}<br>score: ${sc}<br>${escapeHtml(plan)}`;
  });

  // Running-best computed per run, with a null break between runs so the line
  // visually segments at boundaries.
  const best = [];
  let runIdx = 0;
  let runBest = -Infinity;
  for (let i = 0; i < allRecords.length; i++) {
    if (i > runs[runIdx].endIdx) {
      runIdx++;
      runBest = -Infinity;
      best.push(null);   // gap between runs
    }
    const s = allRecords[i].score;
    if (typeof s === "number" && s > runBest) runBest = s;
    best.push(Number.isFinite(runBest) ? runBest : null);
  }
  // best.length is allRecords.length + (runs.length - 1) due to inserted nulls.
  // We need a parallel x-array that includes the null positions.
  const bestX = [];
  runIdx = 0;
  for (let i = 0; i < allRecords.length; i++) {
    if (i > runs[runIdx].endIdx) {
      runIdx++;
      bestX.push(runs[runIdx].startIdx - 0.5);  // x at the boundary for the null
    }
    bestX.push(i);
  }

  // Vertical dashed separators at every run boundary (between run k-1 and run k).
  const shapes = runs.slice(1).map(r => ({
    type: "line",
    xref: "x", yref: "paper",
    x0: r.startIdx - 0.5, x1: r.startIdx - 0.5,
    y0: 0, y1: 1,
    line: { color: "#bbb", width: 1, dash: "dash" }
  }));

  const dots = {
    x: xs, y: ys,
    mode: "markers",
    type: "scatter",
    name: "attempt",
    marker: { color: colors, size: 10, opacity: 0.85, line: { width: 0 } },
    text: hover,
    hovertemplate: "%{text}<extra></extra>"
  };
  const line = {
    x: bestX, y: best,
    mode: "lines",
    type: "scatter",
    name: "running best",
    line: { color: "#1976d2", width: 2.5, shape: "hv" },
    connectgaps: false,
    hoverinfo: "skip"
  };
  const yRange = autoYRange(allRecords);
  const layout = {
    margin: { t: 16, r: 20, b: 44, l: 56 },
    xaxis: { title: "iteration (cumulative across runs)", gridcolor: "#eee" },
    yaxis: {
      title: "validation accuracy",
      gridcolor: "#eee",
      ...(yRange ? { range: yRange, autorange: false } : {})
    },
    plot_bgcolor: "#fff", paper_bgcolor: "#fff",
    showlegend: false,
    hovermode: "closest",
    shapes
  };
  Plotly.newPlot("chart", [line, dots], layout, { displayModeBar: false, responsive: true });

  document.getElementById("chart").on("plotly_click", ev => {
    const pt = ev.points[0];
    if (!pt || pt.curveNumber !== 1) return;
    renderDetail(allRecords[pt.pointIndex]);
  });
}

function renderHeaderCombined(allRecords, runs) {
  const meta = document.getElementById("meta");
  const totalCost = allRecords.reduce((a, r) => a + (r.cost_usd || 0), 0);
  const bestScore = allRecords.reduce(
    (b, r) => (typeof r.score === "number" && r.score > b) ? r.score : b,
    -Infinity
  );
  const bestStr = Number.isFinite(bestScore) ? bestScore.toFixed(4) : "n/a";
  meta.innerHTML = `
    <span><a href="?">← back to picker</a></span>
    <span>combined view</span>
    <span>runs: ${runs.length}</span>
    <span>total iterations: ${allRecords.length}</span>
    <span>best across all: <strong>${bestStr}</strong></span>
    <span>total cost: $${totalCost.toFixed(4)}</span>
    <span>model: ${escapeHtml(modelLabelFromRecords(allRecords))}</span>
  `;
}

async function loadCombined() {
  const files = await discoverTraces();
  if (!files.length) {
    document.querySelector("main").innerHTML =
      `<div class="err">No trace files found in <code>traces/</code>.</div>`;
    return;
  }
  // Sort chronologically (oldest → newest) for a left-to-right timeline.
  const ordered = [...files].sort();

  const allRecords = [];
  const runs = [];
  for (let i = 0; i < ordered.length; i++) {
    const filename = ordered[i];
    const records = await loadTrace(`traces/${filename}`);
    if (!records.length) continue;
    const label = shortRunLabel(filename, i);
    const startIdx = allRecords.length;
    for (const r of records) {
      r._run_label = label;
      r._run_file = filename;
      allRecords.push(r);
    }
    runs.push({ label, file: filename, startIdx, endIdx: allRecords.length - 1 });
  }
  if (!allRecords.length) {
    document.querySelector("main").innerHTML =
      `<div class="err">All trace files were empty.</div>`;
    return;
  }
  renderHeaderCombined(allRecords, runs);
  applySavedChartHeight();
  renderChartCombined(allRecords, runs);
  wireChartHeightSlider();
}

(async () => {
  if (getParam("combined") === "1") {
    try {
      await loadCombined();
    } catch (e) {
      document.querySelector("main").innerHTML =
        `<div class="err">Failed to build combined view: ${escapeHtml(e.message)}</div>`;
      document.getElementById("meta").textContent = "error";
    }
    return;
  }

  let tracePath = getParam("trace");

  if (!tracePath) {
    try {
      const files = await discoverTraces();
      if (files.length === 1) {
        // Auto-redirect when there's exactly one trace.
        window.location.replace(`?trace=traces/${encodeURIComponent(files[0])}`);
        return;
      }
      renderTracePicker(files);
    } catch (e) {
      document.querySelector("main").innerHTML =
        `<div class="err">Could not list <code>traces/</code>: ${escapeHtml(e.message)}<br>
        Tip: serve this directory with <code>python -m http.server --bind 127.0.0.1</code>, then open <code>http://localhost:8000/</code>.</div>`;
      document.getElementById("meta").textContent = "error";
    }
    return;
  }

  try {
    const records = await loadTrace(tracePath);
    renderHeader(records, tracePath);
    if (!records.length) {
      document.getElementById("detail").textContent = "Trace file is empty.";
      return;
    }
    applySavedChartHeight();
    renderChart(records);
    wireChartHeightSlider();
  } catch (e) {
    document.querySelector("main").innerHTML =
      `<div class="err">Failed to load trace: ${escapeHtml(e.message)}<br>
      Tip: serve this directory with <code>python -m http.server --bind 127.0.0.1</code> so <code>fetch()</code> can read the JSONL.</div>`;
    document.getElementById("meta").textContent = "error";
  }
})();
</script>
</body>
</html>
